[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --html=reports/report.html
    --self-contained-html

markers =
    smoke: Critical tests for the main functionality
    regression: Complete regression test suite
    e2e: End-to-end user workflow tests